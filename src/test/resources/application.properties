# Configuracoes exclusivas dos testes

# Chave JWT ficticia utilizada somente nos testes
jwt.segredo=chave-exclusiva-para-testes-automatizados-2026-com-mais-de-32-caracteres

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:emprestimos_testes
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Recria as tabelas durante os testes
spring.jpa.hibernate.ddl-auto=create-drop

# Desabilita o console H2 nos testes
spring.h2.console.enabled=false

# Nao cria usuarios de demonstracao durante os testes
app.admin.senha=
app.colaborador.senha=
